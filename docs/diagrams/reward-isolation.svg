<svg xmlns="http://www.w3.org/2000/svg" width="760" height="221" viewBox="0 0 760 221" role="img" aria-labelledby="title desc">
<title id="title">开发探索与评分隔离</title><desc id="desc">求解时仅使用公开开发工具；提交冻结后，私有集产生终局奖励，保留集仅用于评估。</desc>
<defs><marker id="arr-n" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow n" d="M1 1 L7.5 4.5 L1 8" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr-b" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow b" d="M1 1 L7.5 4.5 L1 8" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr-g" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow g" d="M1 1 L7.5 4.5 L1 8" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif}
.canvas{fill:#fbfcfe;stroke:#dce3ec;stroke-width:1.5}
.node,.frame{stroke-width:1.5}
.node.b{fill:#e6eef9;stroke:#6388b6}
.node.g{fill:#e8f4ed;stroke:#52a371}
.node.n{fill:#edf0f4;stroke:#9ba8b9}
.node.a{fill:#fcf2de;stroke:#c69c55}
.node.w{fill:#ffffff;stroke:#d6dde7}
.node.f{fill:#f4f6f9;stroke:#a8b3c2}
.frame.b{fill:#f6f9fe;stroke:#6388b6}.frame.g{fill:#f4faf6;stroke:#52a371}.frame.n{fill:#f7f9fc;stroke:#9ba8b9}
.ink{fill:#1c2b3e}.muted{fill:#53647a}.blueink{fill:#416da3}.greenink{fill:#257749}
.line.n,.arrow.n{stroke:#8290a2}.line.b,.arrow.b{stroke:#6388b6}.line.g,.arrow.g{stroke:#52a371}
@media(prefers-color-scheme:dark){
.canvas{fill:#161e29;stroke:#39465a}
.node.b{fill:#253951;stroke:#78a4d8}
.node.g{fill:#203c31;stroke:#68bd87}
.node.n{fill:#293443;stroke:#8c9bb0}
.node.a{fill:#423624;stroke:#d4ad6c}
.node.w{fill:#202a37;stroke:#53647b}
.node.f{fill:#232d3b;stroke:#7f8ea3}
.frame.b{fill:#1b293b;stroke:#78a4d8}.frame.g{fill:#1b3028;stroke:#68bd87}.frame.n{fill:#1c2633;stroke:#65748a}
.ink{fill:#edf2f8}.muted{fill:#b0bdcf}.blueink{fill:#9bc3f1}.greenink{fill:#8bd3a3}
.line.n,.arrow.n{stroke:#a1b0c2}.line.b,.arrow.b{stroke:#78a4d8}.line.g,.arrow.g{stroke:#68bd87}
}
</style>
<rect class="canvas" x="1" y="1" width="758" height="219" rx="15"/>
<rect x="18" y="17" width="260" height="188" rx="12" class="frame g" stroke-dasharray="7 5"/>
<text x="148" y="41" class="greenink" font-size="17" font-weight="600" text-anchor="middle">求解阶段</text>
<path d="M148 92 V128" class="line g" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-g)" marker-start="url(#arr-g)"/>
<path d="M251 70 H292 V111 H315" class="line n" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-n)"/>
<path d="M463 111 H480 V62 H502" class="line n" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-n)"/>
<path d="M480 111 V161 H502" class="line n" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-n)"/>
<rect x="45" y="50" width="206" height="42" rx="9" class="node b"/>
<text x="148" y="77.46000000000001" class="ink" font-size="19" font-weight="600" text-anchor="middle">Agent</text>
<rect x="45" y="128" width="206" height="53" rx="9" class="node g"/>
<text x="148" y="149.28" class="ink" font-size="17" font-weight="600" text-anchor="middle">公开测试 / 自主实验</text>
<text x="148" y="171.28" class="muted" font-size="15" font-weight="400" text-anchor="middle">只提供开发反馈</text>
<rect x="315" y="80" width="148" height="62" rx="9" class="node n"/>
<text x="389" y="106.46000000000001" class="ink" font-size="19" font-weight="600" text-anchor="middle">submit</text>
<text x="389" y="128.46" class="muted" font-size="15" font-weight="400" text-anchor="middle">冻结并停止</text>
<rect x="502" y="31" width="234" height="62" rx="9" class="node b"/>
<text x="619" y="57.46" class="ink" font-size="19" font-weight="600" text-anchor="middle">私有奖励集</text>
<text x="619" y="79.46000000000001" class="muted" font-size="15" font-weight="400" text-anchor="middle">终局 Reward</text>
<rect x="502" y="130" width="234" height="62" rx="9" class="node n"/>
<text x="619" y="156.46" class="ink" font-size="19" font-weight="600" text-anchor="middle">独立保留集</text>
<text x="619" y="178.46" class="muted" font-size="15" font-weight="400" text-anchor="middle">评估结果，不改奖励</text>
<text x="389" y="168" class="muted" font-size="14" font-weight="500" text-anchor="middle">私有细节不回流</text>
</svg>
