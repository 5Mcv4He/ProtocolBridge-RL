<svg xmlns="http://www.w3.org/2000/svg" width="760" height="478" viewBox="0 0 760 478" role="img" aria-labelledby="title desc">
<title id="title">队列任务的生命周期与独立账目</title>
<desc id="desc">契约示意：请求接受消耗名额，APB 完成不释放名额，B 或 R 握手消费才退休。Scoreboard 的有序队列与独立握手账本逐边沿核对；可信检查器不一致返回不可判定。</desc>
<defs><marker id="arr-n" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow n" d="M1 1 L7.5 4.5 L1 8" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr-b" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow b" d="M1 1 L7.5 4.5 L1 8" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr-g" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow g" d="M1 1 L7.5 4.5 L1 8" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif}
.canvas{fill:#fbfcfe;stroke:#dce3ec;stroke-width:1.5}
.node,.frame{stroke-width:1.5}
.node.b{fill:#e6eef9;stroke:#6388b6}
.node.g{fill:#e8f4ed;stroke:#52a371}
.node.n{fill:#edf0f4;stroke:#9ba8b9}
.node.a{fill:#fcf2de;stroke:#c69c55}
.node.w{fill:#ffffff;stroke:#d6dde7}
.node.f{fill:#f4f6f9;stroke:#a8b3c2}
.frame.b{fill:#f6f9fe;stroke:#6388b6}.frame.g{fill:#f4faf6;stroke:#52a371}.frame.n{fill:#f7f9fc;stroke:#9ba8b9}
.ink{fill:#1c2b3e}.muted{fill:#53647a}.blueink{fill:#416da3}.greenink{fill:#257749}
.line.n,.arrow.n{stroke:#8290a2}.line.b,.arrow.b{stroke:#6388b6}.line.g,.arrow.g{stroke:#52a371}
@media(prefers-color-scheme:dark){
.canvas{fill:#161e29;stroke:#39465a}
.node.b{fill:#253951;stroke:#78a4d8}
.node.g{fill:#203c31;stroke:#68bd87}
.node.n{fill:#293443;stroke:#8c9bb0}
.node.a{fill:#423624;stroke:#d4ad6c}
.node.w{fill:#202a37;stroke:#53647b}
.node.f{fill:#232d3b;stroke:#7f8ea3}
.frame.b{fill:#1b293b;stroke:#78a4d8}.frame.g{fill:#1b3028;stroke:#68bd87}.frame.n{fill:#1c2633;stroke:#65748a}
.ink{fill:#edf2f8}.muted{fill:#b0bdcf}.blueink{fill:#9bc3f1}.greenink{fill:#8bd3a3}
.line.n,.arrow.n{stroke:#a1b0c2}.line.b,.arrow.b{stroke:#78a4d8}.line.g,.arrow.g{stroke:#68bd87}
}
</style>

<rect class="canvas" x="1" y="1" width="758" height="476" rx="15"/>
<text class="ink" x="30" y="36" font-size="19" font-weight="600">一个请求何时才释放容量？</text>
<text class="muted" x="730" y="35" text-anchor="end" font-size="14">契约示意，非实测波形</text>
<path class="line n" d="M238 103 H270" fill="none" stroke-width="1.8" marker-end="url(#arr-n)"/>
<path class="line n" d="M490 103 H522" fill="none" stroke-width="1.8" marker-end="url(#arr-n)"/>
<rect class="node b" x="30" y="65" width="208" height="76" rx="9"/>
<text class="ink" x="134" y="96" text-anchor="middle" font-size="19">AXI 接受请求</text>
<text class="muted" x="134" y="122" text-anchor="middle" font-size="16">AW / W / AR 握手</text>
<rect class="node g" x="276" y="65" width="208" height="76" rx="9"/>
<text class="ink" x="380" y="96" text-anchor="middle" font-size="19">APB 执行完成</text>
<text class="muted" x="380" y="122" text-anchor="middle" font-size="16">PSEL · PENABLE · PREADY</text>
<rect class="node b" x="530" y="65" width="200" height="76" rx="9"/>
<text class="ink" x="630" y="96" text-anchor="middle" font-size="19">AXI 消费响应</text>
<text class="muted" x="630" y="122" text-anchor="middle" font-size="16">B / R 握手 → 退休</text>
<path class="line b" d="M134 159 V173 H630 V159" fill="none" stroke-width="2"/>
<text class="blueink" x="380" y="199" text-anchor="middle" font-size="17">整个区间占用名额；响应背压延长其生命周期</text>
<rect class="frame n" x="20" y="220" width="720" height="200" rx="12"/>
<text class="muted" x="380" y="247" text-anchor="middle" font-size="16">两条检查路径只观察接口，不读取候选内部计数器</text>
<rect class="node g" x="36" y="265" width="318" height="77" rx="9"/>
<text class="ink" x="195" y="294" text-anchor="middle" font-size="19">独立握手账本</text>
<text class="muted" x="195" y="320" text-anchor="middle" font-size="16">累计接受 − 退休；复位清零</text>
<rect class="node b" x="406" y="265" width="318" height="77" rx="9"/>
<text class="ink" x="565" y="294" text-anchor="middle" font-size="19">Scoreboard 有序队列</text>
<text class="muted" x="565" y="320" text-anchor="middle" font-size="16">事务身份、载荷、顺序与响应</text>
<path class="line n" d="M195 342 V370 H293" fill="none" stroke-width="1.8" marker-end="url(#arr-n)"/>
<path class="line n" d="M565 342 V370 H467" fill="none" stroke-width="1.8" marker-end="url(#arr-n)"/>
<rect class="node n" x="295" y="351" width="170" height="39" rx="9"/>
<text class="ink" x="380" y="377" text-anchor="middle" font-size="17">逐边沿核对账目</text>
<text class="muted" x="380" y="406" text-anchor="middle" font-size="14">同时要求实际执行标记；不以检查代码存在替代执行证据</text>
<text class="ink" x="380" y="449" text-anchor="middle" font-size="17">可信侧账目不一致 → Reward=null；确认 RTL 违例 → Reward=0</text>
<text class="muted" x="380" y="469" text-anchor="middle" font-size="13">有限独立检查与正反对照仍不是穷尽证明</text>
</svg>
