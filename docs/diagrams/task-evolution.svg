<svg xmlns="http://www.w3.org/2000/svg" width="760" height="268" viewBox="0 0 760 268" role="img" aria-labelledby="title desc">
<title id="title">X2P：四个 RTL 任务的能力关系</title><desc id="desc">适用范围为原始 X2P 任务。001为单事务转换；002扩展空间路由，003扩展有限队列仲裁，004进一步解耦执行与响应。</desc>
<defs><marker id="arr-n" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow n" d="M1 1 L7.5 4.5 L1 8" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr-b" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow b" d="M1 1 L7.5 4.5 L1 8" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arr-g" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow g" d="M1 1 L7.5 4.5 L1 8" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif}
.canvas{fill:#fbfcfe;stroke:#dce3ec;stroke-width:1.5}
.node,.frame{stroke-width:1.5}
.node.b{fill:#e6eef9;stroke:#6388b6}
.node.g{fill:#e8f4ed;stroke:#52a371}
.node.n{fill:#edf0f4;stroke:#9ba8b9}
.node.a{fill:#fcf2de;stroke:#c69c55}
.node.w{fill:#ffffff;stroke:#d6dde7}
.node.f{fill:#f4f6f9;stroke:#a8b3c2}
.frame.b{fill:#f6f9fe;stroke:#6388b6}.frame.g{fill:#f4faf6;stroke:#52a371}.frame.n{fill:#f7f9fc;stroke:#9ba8b9}
.ink{fill:#1c2b3e}.muted{fill:#53647a}.blueink{fill:#416da3}.greenink{fill:#257749}
.line.n,.arrow.n{stroke:#8290a2}.line.b,.arrow.b{stroke:#6388b6}.line.g,.arrow.g{stroke:#52a371}
@media(prefers-color-scheme:dark){
.canvas{fill:#161e29;stroke:#39465a}
.node.b{fill:#253951;stroke:#78a4d8}
.node.g{fill:#203c31;stroke:#68bd87}
.node.n{fill:#293443;stroke:#8c9bb0}
.node.a{fill:#423624;stroke:#d4ad6c}
.node.w{fill:#202a37;stroke:#53647b}
.node.f{fill:#232d3b;stroke:#7f8ea3}
.frame.b{fill:#1b293b;stroke:#78a4d8}.frame.g{fill:#1b3028;stroke:#68bd87}.frame.n{fill:#1c2633;stroke:#65748a}
.ink{fill:#edf2f8}.muted{fill:#b0bdcf}.blueink{fill:#9bc3f1}.greenink{fill:#8bd3a3}
.line.n,.arrow.n{stroke:#a1b0c2}.line.b,.arrow.b{stroke:#78a4d8}.line.g,.arrow.g{stroke:#68bd87}
}
</style>
<rect class="canvas" x="1" y="1" width="758" height="266" rx="15"/>
<path d="M380 70 V83 H193 V98" class="line b" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-b)"/>
<path d="M380 83 H567 V98" class="line b" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-b)"/>
<path d="M567 164 V185" class="line b" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-b)"/>
<rect x="214" y="16" width="332" height="54" rx="9" class="node b"/>
<text x="380" y="38.46" class="ink" font-size="19" font-weight="600" text-anchor="middle">001 · 基础协议转换</text>
<text x="380" y="60.46" class="muted" font-size="15" font-weight="400" text-anchor="middle">单目标 / 单笔未完成事务</text>
<rect x="32" y="98" width="322" height="66" rx="9" class="node b"/>
<text x="193" y="126.46000000000001" class="ink" font-size="19" font-weight="600" text-anchor="middle">002 · 多目标路由</text>
<text x="193" y="148.46" class="muted" font-size="15" font-weight="400" text-anchor="middle">地址译码 / 响应选择 / DECERR</text>
<rect x="406" y="98" width="322" height="66" rx="9" class="node b"/>
<text x="567" y="126.46000000000001" class="ink" font-size="19" font-weight="600" text-anchor="middle">003 · 有限队列与仲裁</text>
<text x="567" y="148.46" class="muted" font-size="15" font-weight="400" text-anchor="middle">独立 FIFO / 2 个未退休名额</text>
<rect x="406" y="185" width="322" height="66" rx="9" class="node b"/>
<text x="567" y="213.46" class="ink" font-size="19" font-weight="600" text-anchor="middle">004 · 执行与响应解耦</text>
<text x="567" y="235.46" class="muted" font-size="15" font-weight="400" text-anchor="middle">3 个名额 / 独立 B、R 响应队列</text>
<text x="193" y="198" class="blueink" font-size="18" font-weight="500" text-anchor="middle">空间路由能力</text>
<text x="193" y="224" class="muted" font-size="15" font-weight="400" text-anchor="middle">与并发能力独立扩展</text>
</svg>
